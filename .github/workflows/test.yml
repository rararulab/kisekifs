name: Test

on:
  workflow_call:

concurrency:
  group: test-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  # Get Rust version for test jobs
  rust-version:
    name: Get Rust Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.rust-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Get Rust version from toolchain
        id: rust-version
        run: |
          RUST_VERSION=$(grep 'channel = ' rust-toolchain.toml | cut -d '"' -f 2)
          echo "version=$RUST_VERSION" >> "$GITHUB_OUTPUT"
          echo "Rust version: $RUST_VERSION"

  # KisekiFS currently supports Linux FUSE. Hosted macOS runners do not ship
  # macFUSE, so macOS is not a meaningful required test target yet.
  rust-test:
    name: Rust Test (Ubuntu)
    runs-on: ubuntu-latest
    needs: rust-version
    # nextest runs cases in separate processes; keep them from sharing the
    # production disk-pool mmap path. DiskPagePool has dedicated unit tests.
    env:
      KISEKI_DISABLE_DISK_POOL: 1
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.rust-version.outputs.version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse3-dev

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "test-ubuntu"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run tests
        run: cargo nextest run --workspace --all-features

  mounted-test:
    name: Mounted Linux Acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run mounted suite in privileged Linux container
        run: |
          set +e
          timeout --foreground 20m env KISEKI_MOUNT_TEST_USE_DOCKER=1 \
            tests/scripts/run-mounted.sh 2>&1 | tee mounted-test.log
          status=${PIPESTATUS[0]}
          set -e
          tail -c 131072 mounted-test.log > mounted-test-tail.log
          exit "$status"

      - name: Upload bounded mounted-test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mounted-test-log
          path: mounted-test-tail.log
          retention-days: 7

      - name: Report leaked mount state
        if: always()
        run: |
          findmnt -rn -t fuse.kisekifs || true
          ps -eo pid,args | grep '[k]iseki-binary mount' || true
          docker ps --format '{{.ID}} {{.Image}} {{.Status}}' || true

  # Aggregator job to ensure all tests pass
  test-success:
    name: Test Success
    runs-on: ubuntu-latest
    needs: [rust-test, mounted-test]
    if: always()
    steps:
      - name: Check all test jobs status
        run: |
          if [[ "${{ needs.rust-test.result }}" != "success" || "${{ needs.mounted-test.result }}" != "success" ]]; then
            echo "One or more test jobs failed"
            exit 1
          fi
          echo "All test jobs passed successfully"
