name: Rust

on:
  workflow_call:
    inputs:
      run_code:
        description: "Whether code (vs docs-only) changed; gates the heavy jobs."
        type: string
        default: "true"

concurrency:
  group: rust-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  # Get Rust version for other jobs
  rust-version:
    name: Get Rust Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.rust-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get Rust version from toolchain
        id: rust-version
        run: |
          RUST_VERSION=$(grep 'channel = ' rust-toolchain.toml | cut -d '"' -f 2)
          echo "version=$RUST_VERSION" >> "$GITHUB_OUTPUT"
          echo "Rust version: $RUST_VERSION"

  # Clippy linting
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: rust-version
    if: inputs.run_code == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.rust-version.outputs.version }}
          components: clippy

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse3-dev

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-clippy"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features --no-deps -- -D warnings

  # Documentation generation
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    needs: rust-version
    if: inputs.run_code == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.rust-version.outputs.version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse3-dev

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-docs"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Generate documentation
        run: cargo doc --workspace --all-features --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  miri:
    name: Miri buffer ownership
    runs-on: ubuntu-latest
    if: inputs.run_code == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install nightly Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse3-dev

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-miri"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check owned buffer recycling
        env:
          KISEKI_DISABLE_DISK_POOL: 1
        run: cargo +nightly miri test -p kiseki-storage miri_

  # Coverage report (only on main branch pushes)
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: rust-version
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.run_code == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.rust-version.outputs.version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse3-dev

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-coverage"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Generate coverage report
        env:
          # Coverage runs test binaries concurrently with one another.
          KISEKI_DISABLE_DISK_POOL: 1
        run: |
          cargo tarpaulin \
            --engine llvm \
            --workspace \
            --all-features \
            --no-dead-code \
            --skip-clean \
            --out xml \
            --output-dir ./coverage

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: ./coverage/
          if-no-files-found: error
          retention-days: 30

  advisories:
    name: Dependency Advisories
    runs-on: ubuntu-latest
    needs: rust-version
    if: inputs.run_code == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.rust-version.outputs.version }}

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2

      - name: Check dependency advisories
        run: cargo deny check advisories

  # Aggregator job to ensure all Rust checks pass
  rust-success:
    name: Rust Success
    runs-on: ubuntu-latest
    needs: [clippy, docs, miri, coverage, advisories]
    if: always()
    steps:
      # A skipped job (docs-only change, or coverage off-PR) counts as passing;
      # only a real failure/cancellation blocks. re-actors/alls-green encapsulates
      # that logic instead of hand-rolled result-matching.
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: clippy, docs, miri, coverage, advisories
