name: Feature Request
description: Suggest a new feature or enhancement
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What do you want and why?
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which crate does this relate to?
      options:
        - fuse (FUSE layer)
        - vfs (virtual filesystem logic)
        - meta (metadata / RocksDB backend)
        - storage (write buffer, caches, page pool)
        - types (shared types)
        - common / utils (helpers, object storage)
        - binary (CLI / mount)
        - ci (CI/CD, build, release)
        - other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've thought about
