[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Ryan Tan"]
license = "Apache-2.0"
description = "A fuse filesystem"
exclude = ["benches"]

[workspace]
resolver = "2"
members = [
    "components/types",
    "components/storage",
    "components/utils",
    "tests",
    "components/vfs",
    "components/meta",
    "components/common",
    "components/fuse",
    "components/fuse-backend",
    "components/binary",
]
[workspace.dependencies]
async-trait = "0.1.89"
bincode = "1.3.3"
bitflags = "2.9.4"
byteorder = "1.5.0"
bytes = "1.11.1"
criterion = { version = "0.5.1", features = ["async_tokio", "async_futures"] }
crossbeam = "0.8.4"
crossbeam-channel = "0.5.15"
crossbeam-queue = "0.3.12"
dashmap = "5.5.3"
features = { version = "0.10.0" }
fuser = { version = "0.16.0", features = ["libfuse", "serializable"] }
fuse-backend-rs = "0.14"
futures = "0.3.31"
fs4 = { version = "0.6.6", features = ["sync"] }
humantime = "2.2.0"
libc = "0.2.175"
rangemap = "1.6.0"
rustix = { version = "0.38.44", features = ["mount"] }
scopeguard = "1.2.0"
serde = "1.0.219"
serde_json = "1.0.143"
snafu = "0.8.9"
sonyflake = "0.2.0"
tempfile = "3.21.0"
tokio = { version = "1.47.1", features = ["full", "tracing"] }
tokio-stream = "0.1.17"
tokio-util = { version = "0.7.16", features = ["rt", "io"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
opentelemetry = "0.29"
opentelemetry_sdk = { version = "0.29", features = ["rt-tokio"] }
opentelemetry-prometheus = "0.29"
prometheus = "0.14"
opentelemetry-otlp = { version = "0.29", default-features = false, features = [
    "grpc-tonic",
    "trace",
] }
opentelemetry-semantic-conventions = { version = "0.29", features = [
    "semconv_experimental",
] }
tracing-opentelemetry = "0.30"
strum = "0.27"
strum_macros = "0.27"
bon = "3.7.2"

# test
rstest = "0.19"
tokio-test = "0.4"
proptest = "1.4"
serial_test = "3.5"

[profile.release]
debug = true
panic = 'abort'

# Centralized lint policy. Crates opt in with `[lints] workspace = true`.
# Curated-pragmatic: today's `clippy::all` gate plus a hand-picked set of
# high-value pedantic/nursery lints; noisy or low-value lints are allowed.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
# High-value pedantic/nursery lints (CI's `-D warnings` makes these hard errors).
use_self = "warn"
uninlined_format_args = "warn"
semicolon_if_nothing_returned = "warn"
redundant_clone = "warn"
explicit_iter_loop = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
inefficient_to_string = "warn"
redundant_closure_for_method_calls = "warn"
significant_drop_tightening = "warn"
missing_const_for_fn = "warn"
# Noisy / low-value in this codebase -> allow.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# Pedantic, not auto-fixable, and low-value in struct literals where the field
# type is already obvious -> allow rather than churn every `Default::default()`.
default_trait_access = "allow"
module_name_repetitions = "allow"
doc_markdown = "allow"
too_many_lines = "allow"
